<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image without colosr</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    header {
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      max-width: 900px;
      margin-inline: auto;
    }
    h1, p {
      margin: 0;
    }
    canvas, label {
      display: block;
      margin-inline: auto;
    }
    .btn {
      padding: 0.45rem 0.9rem 0.5rem;
      cursor: pointer;
      border: 1px solid;
    }
    .btn:active {
      background-color: black;
      color: white;
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>Image</h1>
      <p>without color</p>
    </div>
    <div>
      <label for="input-image-field" class="btn"> Select an image file </label>
      <input id="input-image-field" type="file" accept="image/*" style="display: none;">
    </div>
  </header>

  <br>

  <main>
      <canvas id="output-image-canvas"></canvas>
  </main>

  <script>
    const canvas = document.getElementById('output-image-canvas')
    const input_image_field = document.getElementById('input-image-field')
    const img = new Image()
    const ctx = canvas.getContext("2d")
    input_image_field.addEventListener("change", (event) => {
      img.src = URL.createObjectURL(event.target.files[0])
    })
    img.addEventListener("load", (event) => {
      const maxWidth = document.documentElement.clientWidth - 16
      const maxHeight = document.documentElement.clientHeight - 16
      const scale = Math.min(maxWidth / img.width, maxHeight / img.height, 1)
      canvas.width  = img.width * scale;
      canvas.height = img.height * scale;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height)
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixelData = imageData.data;
      for (let i = 0; i < pixelData.length; i+=4) {
        const r = pixelData[i];
        const g = pixelData[i+1];
        const b = pixelData[i+2];
        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
        pixelData[i] = gray;
        pixelData[i+1] = gray;
        pixelData[i+2] = gray;
      }
      ctx.putImageData(imageData, 0, 0);
    })
  </script>
</body>

</html>
